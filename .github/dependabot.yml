# Dependabot propone cada semana, como pull requests, las actualizaciones de
# dependencias. La CI se ejecuta en cada una, así que solo se fusionan si
# los tests pasan. Las versiones menores y los parches se agrupan en una
# sola propuesta por ecosistema, para no generar ruido.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories: ["/backend", "/frontend"]
    schedule:
      interval: "weekly"
    # Las imágenes base (python, node, nginx) se cambian de versión mayor a
    # mano y a propósito: node:25, por ejemplo, no es una versión LTS.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
