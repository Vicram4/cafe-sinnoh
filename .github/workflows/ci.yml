name: CI

on:
  push:
    branches: [main]
  pull_request:
  # También cada lunes a las 06:00 UTC, aunque no haya cambios: así se
  # detectan vulnerabilidades nuevas en las dependencias (pip-audit, npm audit).
  schedule:
    - cron: "0 6 * * 1"
  # Botón "Run workflow" en la pestaña Actions, para lanzarla a mano.
  workflow_dispatch:

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura del repositorio: la CI no necesita escribir nada.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # PostgreSQL real, la misma versión que en desarrollo: los tests usan
      # migraciones, enums y fechas con zona horaria que SQLite no imita bien.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cafe_sinnoh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/cafe_sinnoh
      # conftest.py la crea si no existe y se niega a usar una BD cuyo
      # nombre no termine en "_test".
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/cafe_sinnoh_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Generar una SECRET_KEY de un solo uso
        # La app no arranca sin una clave de al menos 32 bytes. Es aleatoria
        # en cada ejecución: no hace falta guardarla como secreto de GitHub.
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"
      - run: pytest
      - run: pip-audit -r requirements.txt -r requirements-dev.txt

  frontend:
    name: Frontend (lint + tests + build + npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # "high": falla con vulnerabilidades altas o críticas; las de nivel
      # bajo o moderado se revisan a mano sin bloquear cada push.
      - run: npm audit --audit-level=high

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t cafe-sinnoh-backend backend
      - run: docker build -t cafe-sinnoh-frontend frontend
      - name: Validar la configuración de nginx
        run: docker run --rm cafe-sinnoh-frontend nginx -t
      - name: Comprobar que la app del backend se importa en la imagen
        run: >-
          docker run --rm
          -e DATABASE_URL=postgresql+psycopg://u:p@localhost:5432/db
          -e SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')
          cafe-sinnoh-backend python -c "import app.main"
