# Dos formas de uso:
#   docker compose up -d                        -> solo PostgreSQL, para
#       desarrollar con uvicorn y "npm run dev" en local.
#   docker compose --profile app up -d --build  -> todo (db + backend +
#       frontend con nginx) en http://localhost:8080.
# Ambas comparten la misma base de datos y la misma carpeta de CVs.
services:
  db:
    image: postgres:17-alpine
    container_name: cafe-sinnoh-db
    restart: unless-stopped
    environment:
      # Docker Compose lee estos valores del archivo .env de esta carpeta.
      # La sintaxis ":?" aborta con un mensaje claro si falta la variable,
      # en lugar de arrancar con una contraseña vacía.
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    ports:
      # "127.0.0.1:" limita el acceso a tu propio equipo; sin esto,
      # la base de datos quedaría expuesta a tu red local.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volumen con nombre: los datos sobreviven a reinicios y a
      # "docker compose down". Solo se borran con "down -v".
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Docker marca el servicio como "healthy" cuando PostgreSQL ya
      # acepta conexiones. Útil para que el backend espere a la BD.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["app"]
    build: ./backend
    image: cafe-sinnoh-backend
    container_name: cafe-sinnoh-backend
    restart: unless-stopped
    # SECRET_KEY y demás ajustes, los mismos que en desarrollo local.
    env_file: ./backend/.env
    environment:
      # Sustituye la DATABASE_URL del .env (127.0.0.1): dentro de la red de
      # Docker, la base de datos es el servicio "db".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: http://localhost:${APP_PORT:-8080}
    # Sin "ports": el backend solo es accesible desde nginx, dentro de la
    # red de Docker. De eso depende que sea seguro confiar en la IP que
    # nginx le reenvía (ver backend/Dockerfile).
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    image: cafe-sinnoh-frontend
    container_name: cafe-sinnoh-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
