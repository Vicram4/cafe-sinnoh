server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # nginx rechaza por defecto cuerpos de más de 1 MB, lo que rompería la
    # subida de CVs (hasta 5 MB). Un poco de margen para el resto del formulario.
    client_max_body_size 6m;

    # En nginx, un add_header dentro de un "location" anula TODOS los del
    # "server". Por eso las location de abajo usan "expires" (que no es
    # add_header) para la caché: así heredan siempre estas cabeceras.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No indexar ningún recurso (también imágenes y la API), igual que la
    # etiqueta robots de index.html: es una demo de portfolio.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # La API, en el mismo origen que la web: el navegador no necesita CORS.
    location /api/ {
        # Con el nombre en una variable, nginx lo resuelve en cada petición
        # (DNS interno de Docker, 127.0.0.11) y no solo al arrancar. Si no,
        # nginx no arrancaría sin el backend levantado, y tras reiniciarse el
        # backend con otra IP seguiría usando la antigua (errores 502).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        # El backend toma de aquí la IP real del cliente (límite de login).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos de Vite con huella en el nombre (index-ByXEeimZ.js): cambian
    # de nombre en cada versión, así que se pueden cachear un año.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Rutas de la SPA (/admin/applications...): si no es un archivo real, se
    # sirve index.html y decide React Router. Sin caché, para que tras
    # publicar una versión nueva el navegador no pida páginas que ya no existen.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
